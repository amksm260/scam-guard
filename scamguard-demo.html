    { label: "ओटीपी कॉल", text: "मैं आपके बैंक के फ्रॉड विभाग से बोल रहा हूं। आज आपका खाता फ्रीज हो जाएगा। कृपया अभी मिला ओटीपी मुझे बताएं।" },
    { label: "असली बैंक संदेश", text: "आपका अक्टूबर का बिजली बिल 1240 रुपये 15 तारीख को देय है। कृपया आधिकारिक ऐप या नज़दीकी काउंटर से भुगतान करें।" }

const STR = {

    why: "Why?", whatNow: "What should you do?", empty: "Please paste a message first.",
    footWarn: "Never share your OTP, UPI PIN or Net Banking password with a caller or an unverified link.",

  },

    placeholder: "एसएमएस, व्हाट्सएप संदेश या कॉल ट्रांसक्रिप्ट यहां पेस्ट करें...",
    checkBtn: "यह संदेश जांचें", speak: "परिणाम सुनें",

      urgency: "संदेश जल्दबाज़ी या तुरंत कार्रवाई का दबाव बना रहा है।",
      threat: "यह खाता ब्लॉक, फ्रीज़ या कानूनी कार्रवाई की धमकी दे रहा है।",
      otp: "यह ओटीपी, पिन, पासवर्ड या सीवीवी मांग रहा है — यह कभी साझा नहीं करना चाहिए।",
      payment: "यह भुगतान करने या इनाम पाने के लिए क्यूआर कोड स्कैन करने को कह रहा है।",
      impersonation: "यह किसी बैंक, सरकारी कार्यालय या आधिकारिक सेवा से होने का दावा कर रहा है।",
      badlink: "लिंक शॉर्टनर या असामान्य डोमेन का उपयोग कर रहा है, या बताए गए संगठन से मेल नहीं खाता।",
      none: "पाठ में कोई विशेष चेतावनी संकेत नहीं मिला।"
    }
  }
};

let lang = "en";

const RULES = [
  { key: "urgency", weight: 2, re: /(immediately|urgent|within.*(hour|minute)|act now|today only|expire|तुरंत|आज ही|अभी)/i },
  { key: "threat", weight: 2, re: /(block|suspend|freeze|deactivat|legal action|ब्लॉक|फ्रीज़|निलंबित)/i },
  { key: "otp", weight: 4, re: /(otp|one.?time.?password|\bpin\b|cvv|password|ओटीपी|पिन|पासवर्ड)/i },
  { key: "payment", weight: 3, re: /(pay|transfer|upi|scan.*qr|cashback|won|reward|भुगतान|यूपीआई|क्यूआर|इनाम|जीता)/i },
  { key: "impersonation", weight: 1, re: /(bank|kyc|rbi|income tax|customs|courier|govt|government|बैंक|केवाईसी|सरकार)/i }
];

function checkLink(text) {
  const m = text.match(/https?:\/\/[^\s]+/i);
  if (!m) return { flagged: false };
  const url = m[0];
  const officialHints = /(onlinesbi|hdfcbank\.com|icicibank\.com|indiapost\.gov\.in)/i;
  const badHints = /(bit\.ly|tinyurl|xn--|\d+\.\d+\.\d+\.\d+|\.xyz|\.top|\.info|-verify|-update)/i;
  if (officialHints.test(url)) return { flagged: false };
  if (badHints.test(url)) return { flagged: true };
  return { flagged: false };
}

function analyse(text) {
  const s = STR[lang];
  let score = 0;
  const hit = {};
  RULES.forEach(r => { if (r.re.test(text)) { hit[r.key] = true; score += r.weight; } });
  const link = checkLink(text);
  if (link.flagged) { hit.badlink = true; score += 2; }

  let risk = "LOW";
  if (score >= 6) risk = "HIGH";
  else if (score >= 3) risk = "REVIEW";
  if (hit.otp && (hit.impersonation || hit.urgency || hit.threat)) risk = "HIGH";
  if (hit.payment && hit.badlink) risk = "HIGH";

  const reasonKeys = Object.keys(hit);
  const reasons = reasonKeys.length ? reasonKeys.map(k => s.reasons[k]) : [s.reasons.none];
  return { risk, reasons };
}

function renderSamples() {
  const box = document.getElementById("samples");
  box.innerHTML = "";
  SAMPLES[lang].forEach(sample => {
    const b = document.createElement("button");
    b.className = "px-3 py-1.5 rounded-full border border-outline-variant text-on-surface-variant text-label-md hover:bg-surface-container-high hover:text-on-surface";
    b.textContent = sample.label;
    b.type = "button";
    b.onclick = () => { document.getElementById("input").value = sample.text; };
    box.appendChild(b);
  });
}

function applyLang() {
  const s = STR[lang];
  document.getElementById("title").textContent = s.title;
  document.getElementById("tagline").textContent = s.tagline;
  document.getElementById("statusLabel").textContent = s.statusLabel;
  document.getElementById("stepsPill").textContent = s.stepsPill;
  document.getElementById("helplineLabel").textContent = s.helplineLabel;
  document.getElementById("heroTitle").textContent = s.heroTitle;
  document.getElementById("heroSub").textContent = s.heroSub;
  document.getElementById("input").placeholder = s.placeholder;
  document.getElementById("checkBtn").textContent = s.checkBtn;
  document.getElementById("footDisc").textContent = s.footDisc;
  document.getElementById("footWarn").innerHTML =
    '<span class="material-symbols-outlined text-[18px]">warning</span><span>' + s.footWarn + '</span>';

  const en = document.getElementById("langEn"), hi = document.getElementById("langHi");
  const activeCls = "px-2.5 py-1 rounded text-label-md bg-primary text-on-primary";
  const inactiveCls = "px-2.5 py-1 rounded text-label-md text-on-surface-variant";
  en.className = lang === "en" ? activeCls : inactiveCls;
  hi.className = lang === "hi" ? activeCls : inactiveCls;

  document.documentElement.lang = lang === "hi" ? "hi" : "en";
  renderSamples();
  document.getElementById("result").innerHTML = "";
}

function setLang(l) { lang = l; applyLang(); }

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "hi" ? "hi-IN" : "en-IN";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { /* speech not available */ }
}

const BADGE_STYLE = {
  LOW: "bg-primary-container text-on-primary-container",
  REVIEW: "bg-secondary-container text-on-secondary-container",
  HIGH: "bg-tertiary-container text-on-tertiary"
};
const BADGE_ICON = { LOW: "check_circle", REVIEW: "help", HIGH: "warning" };

function runCheck() {
  const s = STR[lang];
  const text = document.getElementById("input").value.trim();
  const box = document.getElementById("result");
  if (!text) {
    box.innerHTML = '<div class="p-4 rounded-xl bg-surface-container-lowest text-on-surface-variant text-body-md">' + s.empty + '</div>';
    return;
  }

  const { risk, reasons } = analyse(text);
  const actionText = s.actions[risk];
  const reasonList = reasons.map(r => '<li>' + r + '</li>').join("");
  const speakText = s.badges[risk] + '. ' + actionText;

  box.innerHTML = `
    <span class="w-fit inline-flex items-center gap-2 px-4 py-2 rounded-full text-label-lg ${BADGE_STYLE[risk]}">

    </span>
    <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-2">

      </div>

    <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-2">

        <span class="material-symbols-outlined text-[18px]">volume_up</span>${s.speak}

}

applyLang();
</script>
