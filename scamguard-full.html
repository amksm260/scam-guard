<body class="bg-background text-on-surface">

<header class="sticky top-0 z-50 bg-surface/95 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.06)]">

        <span id="statusLabel" class="text-label-md text-on-surface"></span>

        <a class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-tertiary-container text-on-tertiary text-label-md" href="tel:1930">
          <span class="material-symbols-outlined text-[16px]">call</span><span id="helplineLabel"></span>
        </a>
      </div>
    </div>
  </div>
  <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-3">

        <path d="M15 1L28 6.5V16C28 24 22.5 30 15 33C7.5 30 2 24 2 16V6.5L15 1Z" fill="var(--c-primary)"/>

      <button id="langEn" onclick="setLang('en')" type="button">EN</button>
      <button id="langHi" onclick="setLang('hi')" type="button">हिंदी</button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-6 pb-16 flex flex-col gap-5">
  <div>
    <h1 id="heroTitle" class="text-headline-lg-mobile text-on-surface"></h1>
    <p id="heroSub" class="text-body-lg text-on-surface-variant mt-1"></p>
  </div>

  <div class="flex flex-wrap gap-2" id="modeTabs"></div>

  <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-3">
    <div id="panel-message">
      <textarea id="input-message" rows="5" class="w-full rounded-xl border border-outline-variant bg-surface p-3 text-body-lg text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
      <div id="samples" class="flex flex-wrap gap-2 mt-3"></div>
    </div>
    <div id="panel-call" class="hidden">
      <textarea id="input-call" rows="5" class="w-full rounded-xl border border-outline-variant bg-surface p-3 text-body-lg text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
    </div>
    <div id="panel-url" class="hidden">
      <input type="url" id="input-url" class="w-full rounded-xl border border-outline-variant bg-surface p-3 text-body-lg text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary">
    </div>
    <div id="panel-screenshot" class="hidden flex flex-col gap-2">
      <label for="file-screenshot" class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-primary rounded-xl bg-surface p-8 cursor-pointer text-primary font-semibold text-center">
        <span class="material-symbols-outlined text-[32px]">photo_camera</span>
        <span id="uploadHintScreenshot"></span>
        <input type="file" id="file-screenshot" accept="image/*" class="hidden">
      </label>
      <img id="preview-screenshot" class="hidden rounded-lg border border-outline-variant max-w-full">
      <p id="ocrNote" class="text-body-md text-on-surface-variant"></p>
    </div>
    <div id="panel-qr" class="hidden flex flex-col gap-2">
      <label for="file-qr" class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-primary rounded-xl bg-surface p-8 cursor-pointer text-primary font-semibold text-center">
        <span class="material-symbols-outlined text-[32px]">qr_code_2</span>
        <span id="uploadHintQr"></span>
        <input type="file" id="file-qr" accept="image/*" class="hidden">
      </label>
      <img id="preview-qr" class="hidden rounded-lg border border-outline-variant max-w-full">
    </div>

    <button id="checkBtn" onclick="runCheck()" class="w-full py-3.5 rounded-xl bg-primary text-on-primary text-label-lg shadow-sm" type="button"></button>
  </div>

  <div id="result" class="flex flex-col gap-4"></div>
</main>

<footer class="w-full bg-surface-container-low mt-8 shadow-[0_-1px_6px_rgba(0,0,0,0.04)]">

    <p id="footDisc" class="text-body-md text-on-surface-variant"></p>

</footer>

  otp_pin:["It asks for an OTP, UPI PIN, password, or verification code.","यह OTP, UPI पिन, पासवर्ड या सत्यापन कोड मांग रहा है।"],
  payment:["It asks you to make a payment or enter your PIN to 'receive' something.","यह भुगतान करने या कुछ 'पाने' के लिए पिन डालने को कह रहा है।"],
  reward:["It offers an unexpected prize, cashback, or reward.","यह एक अप्रत्याशित इनाम या कैशबैक देने का दावा करता है।"],
  link_action:["It pushes you to click a link or download something right away.","यह तुरंत लिंक पर क्लिक करने या कुछ डाउनलोड करने को कह रहा है।"],
  sensitive_info:["It asks for sensitive personal or financial information.","यह संवेदनशील व्यक्तिगत या वित्तीय जानकारी मांग रहा है।"],
  url_mismatch:["The website address does not match the organisation it claims to be.","वेबसाइट का पता उस संस्था से मेल नहीं खाता जिसका वह दावा करता है।"],
  url_shortener:["The link uses a URL shortener, which can hide the real destination.","यह लिंक एक छोटा किया गया URL है, जो असली पता छुपा सकता है।"],
  url_no_https:["The website does not use a secure (https) connection.","यह वेबसाइट सुरक्षित (https) कनेक्शन का उपयोग नहीं करती।"],
  url_ip_host:["The link points to a raw number-based address instead of a normal website name.","यह लिंक सामान्य वेबसाइट नाम की बजाय सीधे नंबर-आधारित पते पर जाता है।"],
  url_many_subdomains:["The web address has an unusually complicated structure.","इस वेब पते की संरचना असामान्य रूप से जटिल है।"],
};
const URL_SHORTENERS = new Set(["bit.ly","tinyurl.com","t.co","goo.gl","is.gd","cutt.ly","rb.gy","shorturl.at","tiny.cc","ow.ly","buff.ly"]);
const KNOWN_ORG_DOMAINS = { sbi:["onlinesbi.sbi","sbi.co.in"], icici:["icicibank.com"], hdfc:["hdfcbank.com"], axis:["axisbank.com"], pnb:["pnbindia.in"], rbi:["rbi.org.in"], "income tax":["incometax.gov.in"], irctc:["irctc.co.in"], paytm:["paytm.com"], phonepe:["phonepe.com"], "google pay":["pay.google.com"], amazon:["amazon.in","amazon.com"], flipkart:["flipkart.com"], "india post":["indiapost.gov.in"] };

function sig(id){ return {id, why_en:WHY_TEXT[id][0], why_hi:WHY_TEXT[id][1]}; }
function nextAction(level, ids){
  if (level==="HIGH"){
    if (ids.has("otp_pin")) return ["Do not share the OTP, PIN, or password with anyone. End the call or ignore the message, then contact the organisation using the number on their official website or app.","OTP, पिन या पासवर्ड किसी के साथ साझा न करें। कॉल काटें या संदेश को नज़रअंदाज़ करें, फिर संस्था से उनकी आधिकारिक वेबसाइट या ऐप में दिए नंबर से संपर्क करें।"];
    if (ids.has("payment")||ids.has("reward")) return ["Do not make any payment or scan the QR code. Verify the offer independently through the organisation's official app or website.","कोई भुगतान न करें और QR कोड स्कैन न करें। संस्था के आधिकारिक ऐप या वेबसाइट से इसकी पुष्टि करें।"];
    return ["Do not click the link or share any information. Open the organisation's official app or website yourself and verify this message.","लिंक पर क्लिक न करें और कोई जानकारी साझा न करें। खुद संस्था की आधिकारिक ऐप या वेबसाइट खोलकर जांच करें।"];
  }
  if (level==="REVIEW") return ["We found some warning signs, but not enough to be certain. Verify this through an official source before acting, or ask someone you trust.","हमें कुछ चेतावनी के संकेत मिले हैं, पर पूरी तरह निश्चित नहीं हैं। कार्रवाई करने से पहले किसी आधिकारिक स्रोत से पुष्टि करें, या किसी भरोसेमंद व्यक्ति से पूछें।"];
  return ["No major warning signs were found in what you shared. If anything still feels off, it's always fine to verify independently.","जो जानकारी आपने साझा की उसमें कोई बड़ा खतरे का संकेत नहीं मिला। फिर भी अगर कुछ असामान्य लगे, तो स्वतंत्र रूप से पुष्टि करना हमेशा ठीक है।"];
}
function finalize(score, found){
  score = Math.min(score,100);
  const level = score>=THRESHOLD_HIGH?"HIGH":score>=THRESHOLD_REVIEW?"REVIEW":"LOW";
  const ids = new Set(found.map(s=>s.id));
  const [action_en, action_hi] = nextAction(level, ids);
  return { risk_level:level, score, signals:found, action_en, action_hi };
}
function analyzeText(text, sourceType){
  text=text||""; let score=0; const found=[]; const matched=new Set();
  for (const [id,patterns] of Object.entries(PATTERN_GROUPS)){
    for (const re of patterns){ if (re.test(text)){ if(!matched.has(id)){ score+=WEIGHTS[id]; found.push(sig(id)); matched.add(id);} break; } }
  }
  if (sourceType==="call" && matched.has("otp_pin")) score+=10;
  return finalize(score, found);
}
function normalizeUrl(raw){ raw=(raw||"").trim(); if(!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(raw)) raw="http://"+raw; return raw; }
function analyzeUrl(rawUrl){
  const normalized=normalizeUrl(rawUrl); let host="",path="",isHttps=false;
  try{ const u=new URL(normalized); host=(u.hostname||"").toLowerCase(); path=u.pathname||""; isHttps=u.protocol==="https:"; }catch(e){}
  const isIpHost=/^(\d{1,3}\.){3}\d{1,3}$/.test(host);
  const isShortener=URL_SHORTENERS.has(host);
  const labels=host?host.split("."):[];
  const subdomainCount=Math.max(0, labels.length-2);
  const haystack=(host+" "+path).toLowerCase();
  let mismatch=null;
  for (const [orgKeyword,domains] of Object.entries(KNOWN_ORG_DOMAINS)){
    if (haystack.includes(orgKeyword)){ const ok=domains.some(d=>host===d||host.endsWith("."+d)); if(!ok){mismatch=orgKeyword;break;} }
  }
  let score=0; const found=[];
  if (isIpHost){score+=WEIGHTS.url_ip_host; found.push(sig("url_ip_host"));}
  if (isShortener){score+=WEIGHTS.url_shortener; found.push(sig("url_shortener"));}
  if (!isHttps){score+=WEIGHTS.url_no_https; found.push(sig("url_no_https"));}
  if (subdomainCount>=3){score+=WEIGHTS.url_many_subdomains; found.push(sig("url_many_subdomains"));}
  if (mismatch){score+=WEIGHTS.url_mismatch; found.push(sig("url_mismatch"));}
  const result=finalize(score,found); result.domain=host; result.mismatch_org=mismatch; return result;
}
function combine(...results){
  let total=0; const seen=new Set(); const merged=[];
  for (const r of results){ total+=r.score; for (const s of r.signals) if(!seen.has(s.id)){seen.add(s.id); merged.push(s);} }
  return finalize(total, merged);
}
function findFirstUrl(text){ const m=(text||"").match(/(https?:\/\/[^\s]+|www\.[^\s]+)/i); return m?m[0]:null; }
function parseUpiUri(data){
  if(!data||!data.toLowerCase().startsWith("upi://")) return null;
  try{ const u=new URL(data); const p=Object.fromEntries(u.searchParams.entries()); return {payee_vpa:p.pa, payee_name:p.pn, amount:p.am, note:p.tn, raw:data}; }catch(e){return null;}
}

// ---- UI ----
let currentMode="message", currentLang="en", lastResult=null, speaking=false;
function i18n(){ return STRINGS[currentLang]; }

function renderModeTabs(){
  const box = document.getElementById("modeTabs");
  box.innerHTML = "";
  MODES.forEach(m => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mode-btn " + (m.id===currentMode ? "active" : "inactive");
    b.innerHTML = `<span>${m.icon}</span><span>${i18n()[m.labelKey]}</span>`;
    b.onclick = () => { currentMode = m.id; document.getElementById("result").innerHTML=""; lastResult=null; renderModeTabs(); switchPanels(); };
    box.appendChild(b);
  });
}
function switchPanels(){
  ["message","screenshot","url","qr","call"].forEach(m => document.getElementById(`panel-${m}`).classList.toggle("hidden", m!==currentMode));
}
function renderSamples(){
  const box=document.getElementById("samples"); box.innerHTML="";
  SAMPLES[currentLang].forEach(s => {
    const b=document.createElement("button"); b.type="button";
    b.className="px-3 py-1.5 rounded-full border border-outline-variant text-on-surface-variant text-label-md hover:bg-surface-container-high hover:text-on-surface";
    b.textContent=s.label; b.onclick=()=>{document.getElementById("input-message").value=s.text;};
    box.appendChild(b);
  });
}
function applyI18n(){
  const s=i18n();
  document.getElementById("title").textContent=s.app_name;
  document.getElementById("tagline").textContent=s.tagline;
  document.getElementById("statusLabel").textContent=s.statusLabel;
  document.getElementById("stepsPill").textContent=s.stepsPill;
  document.getElementById("helplineLabel").textContent=s.helplineLabel;
  document.getElementById("heroTitle").textContent=s.heroTitle;
  document.getElementById("heroSub").textContent=s.heroSub;
  document.getElementById("input-message").placeholder=s.placeholder_message;
  document.getElementById("input-call").placeholder=s.placeholder_call;
  document.getElementById("input-url").placeholder=s.placeholder_url;
  document.getElementById("uploadHintScreenshot").textContent=s.upload_hint;
  document.getElementById("uploadHintQr").textContent=s.upload_hint;
  document.getElementById("ocrNote").textContent=s.ocr_note;
  document.getElementById("checkBtn").textContent=s.button_check;
  document.getElementById("footDisc").textContent=s.footDisc;
  document.getElementById("footWarn").innerHTML=`<span class="material-symbols-outlined text-[18px]">warning</span><span>${s.footWarn}</span>`;
  const en=document.getElementById("langEn"), hi=document.getElementById("langHi");
  const activeCls="px-2.5 py-1 rounded text-label-md bg-primary text-on-primary";
  const inactiveCls="px-2.5 py-1 rounded text-label-md text-on-surface-variant";
  en.className=currentLang==="en"?activeCls:inactiveCls; hi.className=currentLang==="hi"?activeCls:inactiveCls;
  document.documentElement.lang=currentLang==="hi"?"hi":"en";
  renderModeTabs(); renderSamples();
}
function setLang(l){ currentLang=l; applyI18n(); if(lastResult) renderResult(lastResult); else document.getElementById("result").innerHTML=""; }

function wirePreview(fileInputId, previewId){
  const input=document.getElementById(fileInputId), preview=document.getElementById(previewId);
  input.addEventListener("change", ()=>{
    const file=input.files[0]; if(!file){preview.classList.add("hidden");return;}
    const reader=new FileReader();
    reader.onload=e=>{preview.src=e.target.result; preview.classList.remove("hidden");};
    reader.readAsDataURL(file);
  });
}
wirePreview("file-screenshot","preview-screenshot");
wirePreview("file-qr","preview-qr");

function setLoading(isLoading,label){
  const btn=document.getElementById("checkBtn");
  btn.disabled=isLoading;
  btn.textContent = isLoading ? (label||i18n().button_check) : i18n().button_check;
}
function readFileAsImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=e.target.result;};
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
async function decodeQrFromFile(file){
  const img=await readFileAsImage(file);
  const canvas=document.createElement("canvas"); canvas.width=img.width; canvas.height=img.height;
  const ctx=canvas.getContext("2d"); ctx.drawImage(img,0,0);
  const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const code=window.jsQR?window.jsQR(imageData.data,imageData.width,imageData.height):null;
  return code?code.data:null;
}
async function ocrFromFile(file){
  const result=await Tesseract.recognize(file,"eng");
  return (result&&result.data&&result.data.text)?result.data.text.trim():"";
}

async function runCheck(){
  const region=document.getElementById("result"); region.innerHTML="";

  if (currentMode==="message"){
    const text=document.getElementById("input-message").value.trim(); if(!text) return;
    const textResult=analyzeText(text,"message"); const url=findFirstUrl(text);
    if (url){ const combined=combine(textResult, analyzeUrl(url)); combined.analysed_text=text; combined.url=url; renderResult(combined); }
    else { textResult.analysed_text=text; renderResult(textResult); }
    return;
  }
  if (currentMode==="call"){
    const transcript=document.getElementById("input-call").value.trim(); if(!transcript) return;
    const result=analyzeText(transcript,"call"); result.analysed_text=transcript; renderResult(result);
    return;
  }
  if (currentMode==="url"){
    const url=document.getElementById("input-url").value.trim(); if(!url) return;
    const result=analyzeUrl(url); result.url=url; renderResult(result);
    return;
  }
  if (currentMode==="screenshot"){
    const file=document.getElementById("file-screenshot").files[0]; if(!file) return;
    setLoading(true, i18n().ocr_running);
    try{
      const text=await ocrFromFile(file);
      const textResult=analyzeText(text,"message"); const url=findFirstUrl(text);
      if (url){ const combined=combine(textResult, analyzeUrl(url)); combined.analysed_text=text; combined.url=url; renderResult(combined); }
      else { textResult.analysed_text=text; renderResult(textResult); }
    }catch(e){ region.innerHTML=`<div class="p-4 rounded-xl bg-error-container text-on-error-container text-body-md">${i18n().ocr_failed}</div>`; }
    finally{ setLoading(false); }
    return;
  }
  if (currentMode==="qr"){
    const file=document.getElementById("file-qr").files[0]; if(!file) return;
    try{
      const data=await decodeQrFromFile(file);
      if (!data){ renderResult({no_qr_found:true}); return; }
      const upi=parseUpiUri(data);
      if (upi){ const base=analyzeText("scan this qr code enter your upi pin","message"); base.qr_data=data; base.upi=upi; renderResult(base); return; }
      if (data.toLowerCase().startsWith("http")){ const result=analyzeUrl(data); result.qr_data=data; result.url=data; renderResult(result); return; }
      const result=analyzeText(data,"message"); result.qr_data=data; renderResult(result);
    }catch(e){ region.innerHTML=`<div class="p-4 rounded-xl bg-error-container text-on-error-container text-body-md">${i18n().ocr_failed}</div>`; }
    return;
  }
}

const BADGE_STYLE={LOW:"bg-primary-container text-on-primary-container", REVIEW:"bg-secondary-container text-on-secondary-container", HIGH:"bg-tertiary-container text-on-tertiary"};
const BADGE_ICON={LOW:"check_circle", REVIEW:"help", HIGH:"warning"};
function riskLabel(level){ return level==="HIGH"?i18n().result_high:level==="REVIEW"?i18n().result_review:i18n().result_low; }
function escapeHtml(str){ const d=document.createElement("div"); d.textContent=str||""; return d.innerHTML; }

function renderResult(data){
  lastResult=data;
  const region=document.getElementById("result");
  if (data.no_qr_found){ region.innerHTML=`<div class="p-4 rounded-xl bg-secondary-container text-on-secondary-container text-body-md">${i18n().no_qr_found}</div>`; return; }
  const level=data.risk_level||"REVIEW";
  const why=(data.signals||[]).map(s=>currentLang==="hi"?s.why_hi:s.why_en);
  const action=currentLang==="hi"?data.action_hi:data.action_en;
  const reasonList=why.map(w=>`<li>${escapeHtml(w)}</li>`).join("");
  const speakText=riskLabel(level)+". "+action;

  let upiHtml="";
  if (data.upi){
    upiHtml=`<div class="p-4 rounded-xl bg-surface-container-lowest shadow-sm text-body-md">
      <strong>${i18n().upi_detected}</strong><br>
      ${(data.upi.payee_name||data.upi.payee_vpa)?`${i18n().upi_payee}: ${escapeHtml(data.upi.payee_name||data.upi.payee_vpa)}<br>`:""}
      ${data.upi.amount?`${i18n().upi_amount}: ₹${escapeHtml(data.upi.amount)}`:""}
    </div>`;
  }
  let detectedHtml="";
  if (data.analysed_text) detectedHtml += `<div class="p-3 rounded-xl bg-surface-container-high text-on-surface-variant text-body-md whitespace-pre-wrap">${escapeHtml(data.analysed_text)}</div>`;
  if (data.url) detectedHtml += `<div class="p-3 rounded-xl bg-surface-container-high text-on-surface-variant text-body-md break-all">${escapeHtml(data.url)}</div>`;

  region.innerHTML = `
    <span class="w-fit inline-flex items-center gap-2 px-4 py-2 rounded-full text-label-lg ${BADGE_STYLE[level]}">
      <span class="material-symbols-outlined text-[20px]">${BADGE_ICON[level]}</span>${riskLabel(level)}
    </span>
    ${upiHtml}
    <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-2">
      <div class="w-10 h-10 rounded-xl bg-surface-container-high text-primary flex items-center justify-center"><span class="material-symbols-outlined">search</span></div>
      <h3 class="text-title-lg text-on-surface">${i18n().why_heading}</h3>
      ${why.length?`<ul class="list-disc pl-5 text-body-md text-on-surface-variant">${reasonList}</ul>`:`<p class="text-body-md text-on-surface-variant">${i18n().no_signals}</p>`}
    </div>
    <div class="p-5 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-2">
      <div class="w-10 h-10 rounded-xl bg-surface-container-high text-primary flex items-center justify-center"><span class="material-symbols-outlined">shield</span></div>
      <h3 class="text-title-lg text-on-surface">${i18n().action_heading}</h3>
      <p class="text-body-lg text-on-surface font-semibold">${escapeHtml(action||"")}</p>
      <button onclick='speak(${JSON.stringify(speakText)})' class="inline-flex w-fit items-center gap-2 mt-1 px-3 py-2 rounded-lg border border-outline-variant text-on-surface text-label-md" type="button">
        <span class="material-symbols-outlined text-[18px]">volume_up</span>${i18n().read_aloud}
      </button>
      <button onclick="askTrustedPerson()" class="inline-flex w-fit items-center gap-2 px-3 py-2 rounded-lg border border-outline-variant text-on-surface text-label-md" type="button">
        <span class="material-symbols-outlined text-[18px]">group</span>${i18n().ask_trusted}
      </button>
    </div>
    ${detectedHtml}
  `;
}

function speak(text){
  try{ const u=new SpeechSynthesisUtterance(text); u.lang=currentLang==="hi"?"hi-IN":"en-IN"; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function askTrustedPerson(){
  if (!lastResult) return;
  const level=riskLabel(lastResult.risk_level||"REVIEW");
  const why=(lastResult.signals||[]).map(s=>currentLang==="hi"?s.why_hi:s.why_en);
  const action=currentLang==="hi"?lastResult.action_hi:lastResult.action_en;
  const summary=`${i18n().trusted_intro}\n\n${[level,...why,action].filter(Boolean).join(". ")}`;
  if (navigator.share){ navigator.share({title:i18n().app_name, text:summary}).catch(()=>{}); }
  else { window.open(`https://wa.me/?text=${encodeURIComponent(summary)}`, "_blank"); }
}

switchPanels();
applyI18n();
</script>
